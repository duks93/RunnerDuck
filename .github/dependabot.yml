version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/LocalPackage"
    schedule:
      interval: "daily"
      timezone: "Asia/Seoul"
      time: "09:00"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
      time: "09:00"
  - package-ecosystem: "nuget"
    directories:
      - "/Windows/*"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
      time: "09:00"
    groups:
      test-packages:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
